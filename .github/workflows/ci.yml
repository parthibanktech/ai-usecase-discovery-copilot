name: CI & Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint & Validate Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax Across All Scripts
        run: |
          python -m py_compile *.py

      - name: Verify Package Imports & Pydantic Schema Contracts
        run: |
          python -c "
          import pydantic
          import langchain_deepseek
          import gradio
          from pydantic import BaseModel, Field

          # Validate schema definitions
          from 10_production_grade_app import UseCaseAssessment
          assert issubclass(UseCaseAssessment, BaseModel)
          print('✅ Production Pydantic contracts validated successfully.')
          "
